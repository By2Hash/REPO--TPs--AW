<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Élite - Catálogo Hombre</title>
    <link rel="stylesheet" href="./recursos/estilo/style.css">
    <link rel="icon" href="./recursos/imagenes/logo/elite_icono.png">
    <script type="module" src="./recursos/js/paginas/catalogo.js"></script>
</head>
<body>
    <header class="encabezado-principal">
        <nav class="menu-principal" aria-label="Menú principal">
            <a class="menu-principal__logo" href="index.html">
                <img class="menu-principal__logo-imagen" src="./recursos/imagenes/logo/elite_logo.png" alt="Élite - Inicio">
            </a>
            <a class="menu-principal__enlace" href="index.html">Inicio</a>
            <a class="menu-principal__enlace menu-principal__enlace--activo" aria-current="page" href="catalogo_hombre.html">Hombre</a>
            <a class="menu-principal__enlace" href="catalogo_mujer.html">Mujer</a>
            <a class="menu-principal__enlace" href="carrito.html">Carrito <span class="menu-principal__contador" data-carrito-contador hidden>0</span></a>
        </nav>
    </header>

    <main class="contenido-principal">
        <nav class="migas" aria-label="Migas de pan"><a class="migas__enlace" href="index.html">Inicio</a> &gt; <span>Hombre</span></nav>

        <h1 class="titulo-pagina">COLECCIÓN HOMBRE</h1>

        <section class="filtros-catalogo" aria-label="Filtros y ordenamiento">
            <form class="filtros-catalogo__form" id="filtros-catalogo" role="search">
                <label class="filtros-catalogo__etiqueta" for="buscar">Buscar:
                    <input class="filtros-catalogo__select" type="search" name="buscar" id="buscar" placeholder="Nombre, color..." autocomplete="off">
                </label>
                <label class="filtros-catalogo__etiqueta" for="categoria">Categoría:
                    <select class="filtros-catalogo__select" name="categoria" id="categoria">
                        <option value="">Todas</option>
                    </select>
                </label>
                <label class="filtros-catalogo__etiqueta" for="ordenar">Ordenar por:
                    <select class="filtros-catalogo__select" name="ordenar" id="ordenar">
                        <option value="destacados">Destacados</option>
                        <option value="nuevos">Nuevos</option>
                        <option value="az">A - Z</option>
                        <option value="za">Z - A</option>
                    </select>
                </label>
                <label class="filtros-catalogo__etiqueta" for="precio">Precio:
                    <select class="filtros-catalogo__select" name="precio" id="precio">
                        <option value="">Sin orden</option>
                        <option value="mayor">Mayor a menor</option>
                        <option value="menor">Menor a mayor</option>
                    </select>
                </label>
                <label class="filtros-catalogo__etiqueta" for="talle">Talle:
                    <select class="filtros-catalogo__select" name="talle" id="talle">
                        <option value="">Todos</option>
                    </select>
                </label>
                <label class="filtros-catalogo__etiqueta" for="color">Color:
                    <select class="filtros-catalogo__select" name="color" id="color">
                        <option value="">Todos</option>
                    </select>
                </label>
                <button class="boton boton--contorno" type="reset">Limpiar filtros</button>
            </form>
            <p class="filtros-catalogo__cantidad" id="filtros-cantidad" role="status"></p>
        </section>

        <p class="estado-carga" data-estado role="status">Cargando productos...</p>

        <ul class="grilla-productos" id="grilla-productos" data-genero="hombre"></ul>
    </main>

    <footer class="pie-pagina">
        <p class="pie-pagina__texto">&copy; 2026 Élite Ropa. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
